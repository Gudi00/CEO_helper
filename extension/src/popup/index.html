<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>LMS Quiz Assistant</title>
    <style>
      :root { color-scheme: light; }
      body {
        font: 13px/1.4 system-ui, sans-serif;
        margin: 0;
        padding: 12px;
        width: 320px;
        color: #111827;
      }
      h1 { font-size: 14px; margin: 0 0 12px; }
      label { display: block; margin: 8px 0 4px; font-weight: 600; }
      input, select {
        width: 100%; box-sizing: border-box;
        padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 4px;
        font: inherit;
      }
      .row { display: flex; gap: 8px; }
      .row > * { flex: 1; }
      button {
        padding: 8px 12px; border: 1px solid #d1d5db;
        background: #f9fafb; cursor: pointer; border-radius: 4px;
        font: inherit;
      }
      .btn-primary { background: #2ecc71; color: #fff; border-color: #2ecc71; }
      .btn-danger  { background: #ef4444; color: #fff; border-color: #ef4444; }
      .status {
        margin-top: 12px; padding: 8px; border-radius: 4px;
        background: #f3f4f6;
      }
      .status--ok { background: #ecfdf5; color: #047857; }
      .status--err { background: #fef2f2; color: #b91c1c; }
      .small { font-size: 11px; color: #6b7280; }
      textarea {
        width: 100%; box-sizing: border-box;
        padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 4px;
        font: inherit; resize: vertical; min-height: 80px;
      }
      details { margin: 10px 0 0; }
      summary {
        cursor: pointer; font-weight: 600; font-size: 12px;
        color: #374151; user-select: none; padding: 4px 0;
      }
      summary:hover { color: #111827; }
      .prompt-footer { display: flex; justify-content: flex-end; margin-top: 4px; }
      .btn-sm {
        padding: 3px 8px; font-size: 11px; border: 1px solid #d1d5db;
        background: #f3f4f6; cursor: pointer; border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>LMS Quiz Assistant</h1>

    <div class="row">
      <div>
        <label for="mode">Режим</label>
        <select id="mode">
          <option value="assist">Подсказчик</option>
          <option value="step_by_step">Step-by-step</option>
          <option value="full_auto">Full auto</option>
        </select>
      </div>
      <div>
        <label for="model-preference">Модель</label>
        <select id="model-preference">
          <option value="accurate">Точная (deepseek-r1)</option>
          <option value="fast">Быстрая (qwen2.5)</option>
        </select>
      </div>
    </div>

    <label for="cmid">cmid (id теста)</label>
    <input id="cmid" placeholder="например 305095" />

    <label for="backend-url">Backend URL</label>
    <input id="backend-url" value="http://127.0.0.1:8765" />

    <label for="backend-token">Backend Token</label>
    <input id="backend-token" type="password" placeholder="из ~/.config/lms-tool/token" />

    <label class="small">
      <input type="checkbox" id="show-overlay" /> Показывать подсветку в DOM
    </label>

    <details>
      <summary>Системный промт (необязательно)</summary>
      <textarea
        id="system-prompt"
        placeholder="Оставь пустым — будет технический промт по умолчанию.&#10;&#10;Пример для истории:&#10;Ты — эксперт по истории Беларуси. Отвечай строго по белорусской историографии и учебной программе БГУИР."
      ></textarea>
      <div class="prompt-footer">
        <button id="prompt-reset" class="btn-sm" type="button">Сбросить к умолчанию</button>
      </div>
    </details>

    <div class="row" style="margin-top: 12px">
      <button id="start" class="btn-primary" type="button">Старт</button>
      <button id="stop" class="btn-danger" type="button">Стоп</button>
    </div>

    <div id="status" class="status">Backend: проверка…</div>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
