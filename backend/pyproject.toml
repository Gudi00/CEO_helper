[project]
name = "lms-quiz-backend"
version = "0.1.0"
description = "Local backend for LMS quiz automation tool"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "EPAM intern" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "google-genai>=1.0",
    "ollama>=0.4",
    "websockets>=13",
    "python-multipart>=0.0.12",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
engine = [
    "undetected-chromedriver>=3.5",
    "selenium>=4.27",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RET", "PT", "C4", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends() в default args

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not e2e'"
markers = [
    "e2e: end-to-end browser tests (slow, require Playwright + extension dist build)",
]

[tool.coverage.run]
source = ["src"]
